[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-lottery-football-analysis"
version = "0.1.0"
description = "中国体育彩票竞彩足球历史数据清洗、入库与赛前分析工具"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ZhangHong"}]
dependencies = []

[project.scripts]
sporttery = "sports_lottery.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

